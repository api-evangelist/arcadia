apis:
- name: Arcadia Signal API
  description: >-
    Signal provides a tariff and energy rate calculation engine that allows developers to model the cost
    of any energy usage scenario against North American utility tariffs. It supports cost-benefit analysis,
    bill auditing, and energy procurement optimization by exposing the most comprehensive tariff rate
    database available.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.arcadia.com/
  baseURL: https://api.arcadia.com
  tags:
  - Tariff
  - Energy Rates
  - Cost Modeling
  - Utility Rates
  properties:
  - type: Documentation
    url: https://docs.arcadia.com/
- name: Arcadia Switch API
  description: >-
    Switch enables rate plan optimization by identifying the best utility rate plan for a customer based
    on their actual usage patterns. It supports customer-facing energy plan recommendation workflows for
    utilities, brokers, and energy management platforms.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.arcadia.com/
  baseURL: https://api.arcadia.com
  tags:
  - Rate Plans
  - Energy Optimization
  - Utility Switching
  properties:
  - type: Documentation
    url: https://docs.arcadia.com/
- name: Arcadia Utility Cloud API
  description: >-
    The Utility Cloud API provides enterprise-grade access to Arcadia's full energy data warehouse, enabling
    clients to extract structured data on business entities at scale. It supports integration with data
    platforms such as Snowflake and offers SQL-based access through DataHub for warehouse-native energy
    analytics.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.arcadia.com/v1.0-Utility-Cloud/docs/api-quick-start-guide
